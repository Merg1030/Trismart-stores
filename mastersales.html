<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TriSmart · Marketing Sales</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'DM Sans', sans-serif; 
            background: #f4f6fb; 
            color: #1a1e2e; 
            min-height: 100vh; 
            font-size: 13px;
            padding: 20px;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left .logo { 
            width: 40px; height: 40px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px;
        }
        .header-left h1 { font-size: 1.1rem; font-weight: 800; }
        .header-left .sub { font-size: 0.6rem; opacity: 0.8; font-weight: 500; }
        .header-right { 
            display: flex; 
            align-items: center; 
            gap: 12px;
            flex-wrap: wrap;
        }
        .header-right .stats { 
            background: rgba(255,255,255,0.15); 
            padding: 6px 14px; 
            border-radius: 100px; 
            font-size: 0.7rem; 
            font-weight: 600;
        }
        .header-right .stats span { font-weight: 800; font-size: 0.85rem; }
        
        /* Warehouse Selector */
        .warehouse-section {
            background: white;
            border: 1px solid #e2e6ef;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .warehouse-section label { 
            font-size: 0.6rem; 
            font-weight: 700; 
            color: #6b7490; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .warehouse-section select {
            padding: 6px 12px;
            border: 1px solid #e2e6ef;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #f1f3f5;
            outline: none;
            cursor: pointer;
            min-width: 140px;
        }
        .warehouse-section select:focus { border-color: #4361ee; background: white; }
        .warehouse-section .active-wh {
            font-size: 0.7rem;
            font-weight: 600;
            color: #4361ee;
            background: #eef2ff;
            padding: 4px 12px;
            border-radius: 100px;
        }
        
        /* Search & Actions */
        .actions {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            position: relative;
            min-width: 160px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 34px;
            border: 1px solid #e2e6ef;
            border-radius: 10px;
            font-size: 0.75rem;
            background: white;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: #4361ee; }
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0a8c0;
            font-size: 0.7rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        .btn:active { transform: scale(0.97); opacity: 0.8; }
        .btn-primary { background: #4361ee; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-outline { background: transparent; border: 1px solid #e2e6ef; color: #6b7490; }
        .btn-sm { padding: 4px 10px; font-size: 0.62rem; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        
        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 4px;
        }
        
        .product-card {
            background: white;
            border: 1px solid #e2e6ef;
            border-radius: 12px;
            padding: 14px;
            transition: all 0.2s;
            position: relative;
        }
        .product-card:hover { box-shadow: 0 4px 12px rgba(67,97,238,0.08); border-color: #c7d2fe; }
        .product-card .code {
            font-family: 'DM Mono', monospace;
            font-size: 0.55rem;
            background: #eef2ff;
            color: #4361ee;
            padding: 2px 8px;
            border-radius: 100px;
            display: inline-block;
            font-weight: 700;
        }
        .product-card .name {
            font-size: 0.85rem;
            font-weight: 700;
            margin: 6px 0 4px;
            color: #1a1e2e;
        }
        .product-card .category {
            font-size: 0.55rem;
            color: #6b7490;
            background: #f1f3f5;
            padding: 2px 8px;
            border-radius: 100px;
            display: inline-block;
        }
        .product-card .price {
            font-size: 1rem;
            font-weight: 800;
            color: #4361ee;
            margin: 6px 0;
        }
        .product-card .stock {
            font-size: 0.6rem;
            font-weight: 600;
            color: #6b7490;
        }
        .product-card .stock .num {
            font-weight: 800;
            color: #1a1e2e;
        }
        .product-card .stock .low { color: #ef4444; }
        .product-card .stock .medium { color: #f59e0b; }
        .product-card .stock .high { color: #10b981; }
        .product-card .sell-btn {
            width: 100%;
            margin-top: 10px;
            padding: 6px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            background: #10b981;
            color: white;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .product-card .sell-btn:hover { background: #059669; }
        .product-card .sell-btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .product-card .sold-out {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            font-size: 0.5rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 100px;
            text-transform: uppercase;
        }
        .product-card .inactive-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #6b7490;
            color: white;
            font-size: 0.5rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 100px;
            text-transform: uppercase;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7490;
            grid-column: 1 / -1;
        }
        .empty-state i { font-size: 2.5rem; color: #d1d5db; margin-bottom: 12px; }
        .empty-state h3 { font-size: 0.9rem; color: #1a1e2e; margin-bottom: 4px; }
        .empty-state p { font-size: 0.7rem; }
        
        /* Modal */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .modal-bg.open { display: flex; }
        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.2s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-box h3 {
            font-size: 0.95rem;
            font-weight: 800;
            color: #4361ee;
            margin-bottom: 4px;
        }
        .modal-box .sub-info {
            font-size: 0.7rem;
            color: #6b7490;
            margin-bottom: 14px;
        }
        .modal-box .sub-info strong { color: #1a1e2e; }
        .field-group { margin-bottom: 12px; }
        .field-group label {
            font-size: 0.55rem;
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 3px;
            color: #6b7490;
            letter-spacing: 0.5px;
        }
        .field-group input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #e2e6ef;
            font-size: 0.75rem;
            background: #f1f3f5;
            outline: none;
            transition: border-color 0.2s;
        }
        .field-group input:focus {
            border-color: #4361ee;
            background: white;
        }
        .field-group .qty-control {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .field-group .qty-control input { flex: 1; }
        .field-group .qty-control button {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid #e2e6ef;
            background: #f1f3f5;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: #4361ee;
            transition: all 0.15s;
        }
        .field-group .qty-control button:hover { background: #eef2ff; }
        .field-group .qty-control button:active { transform: scale(0.95); }
        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .form-actions .btn { flex: 1; justify-content: center; }
        
        /* Toast */
        .toast-wrap {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .toast {
            background: #1f2937;
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            animation: slideIn 0.25s ease;
            min-width: 200px;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }
        .toast.warning { background: #f59e0b; }
        .toast i { font-size: 0.85rem; }
        
        /* Responsive */
        @media (max-width: 640px) {
            body { padding: 12px; }
            .header { padding: 14px; }
            .header-left h1 { font-size: 0.9rem; }
            .header-right .stats { font-size: 0.6rem; padding: 4px 10px; }
            .product-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .product-card { padding: 10px; }
            .product-card .name { font-size: 0.75rem; }
            .product-card .price { font-size: 0.85rem; }
            .warehouse-section { flex-direction: column; align-items: stretch; }
            .warehouse-section select { width: 100%; }
        }
        @media (max-width: 400px) {
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <div class="logo"><i class="fas fa-bullhorn"></i></div>
        <div>
            <h1>Marketing Sales</h1>
            <div class="sub">Sell from any warehouse · Chris only</div>
        </div>
    </div>
    <div class="header-right">
        <div class="stats">Today: <span id="todayTotal">K0.00</span></div>
        <div class="stats">Month: <span id="monthTotal">K0.00</span></div>
        <button class="btn btn-outline btn-sm" onclick="refreshInventory()"><i class="fas fa-sync-alt"></i></button>
    </div>
</div>

<!-- WAREHOUSE SELECTOR -->
<div class="warehouse-section">
    <label><i class="fas fa-warehouse"></i> Sell From:</label>
    <select id="warehouseSelect" onchange="onWarehouseChange()">
        <option value="">— Select —</option>
        <option value="kabanana">🏪 Kabanana</option>
        <option value="makeni">🏪 Makeni</option>
    </select>
    <span class="active-wh" id="activeWh">No warehouse selected</span>
</div>

<!-- SEARCH -->
<div class="actions">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search products..." oninput="renderProducts()">
    </div>
</div>

<!-- PRODUCT GRID -->
<div class="product-grid" id="productGrid">
    <div class="empty-state">
        <i class="fas fa-warehouse"></i>
        <h3>Select a Warehouse</h3>
        <p>Choose a warehouse above to see products</p>
    </div>
</div>

<!-- SELL MODAL -->
<div class="modal-bg" id="sellModal">
    <div class="modal-box">
        <h3><i class="fas fa-cart-plus" style="color:#10b981;"></i> Sell Product</h3>
        <div class="sub-info">
            <strong id="modalProductName">Product</strong> · 
            <span id="modalProductCode">CODE</span><br>
            Price: <strong id="modalProductPrice">K0.00</strong> · 
            Available: <strong id="modalProductStock">0</strong>
        </div>
        <form id="sellForm">
            <div class="field-group">
                <label>Quantity</label>
                <div class="qty-control">
                    <button type="button" onclick="adjustQty(-1)">−</button>
                    <input type="number" id="sellQty" min="1" value="1" step="1">
                    <button type="button" onclick="adjustQty(1)">+</button>
                </div>
            </div>
            <div class="field-group">
                <label>Customer (optional)</label>
                <input type="text" id="sellCustomer" placeholder="e.g. John Banda">
            </div>
            <div class="field-group">
                <label>Notes (optional)</label>
                <input type="text" id="sellNotes" placeholder="Event / campaign name">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success">Confirm Sale</button>
                <button type="button" class="btn btn-outline" onclick="closeSellModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toastContainer"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
    import { getFirestore, collection, query, where, updateDoc, addDoc, doc, onSnapshot, getDocs, increment, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB-lm7Y3r1F6VvY8PKvY8glLabZDbJsHM1k",
        authDomain: "trismartstores.firebaseapp.com",
        projectId: "trismartstores",
        storageBucket: "trismartstores.appspot.com",
        messagingSenderId: "416692703333",
        appId: "1:416692703333:web:d4b60292621435c748f68c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- AUTH CHECK ---
    const loggedInUser = (localStorage.getItem('loggedInUser') || localStorage.getItem('userName') || '').toLowerCase().trim();
    if (loggedInUser !== 'chris') {
        alert('⚠️ Marketing Sales is ONLY for Chris.');
        window.location.href = 'dashboard.html';
    }

    let selectedWarehouse = '';
    let inventory = [];
    let unsubscribeInv = null;
    let selectedProduct = null;

    const branchMap = {
        'kabanana': { id: 'kabanana', name: 'Kabanana', display: '🏪 KABANANA' },
        'makeni': { id: 'makeni', name: 'Makeni', display: '🏪 MAKENI' }
    };

    // --- TOAST ---
    function showToast(msg, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : type === 'warning' ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    // --- WAREHOUSE ---
    window.onWarehouseChange = function() {
        selectedWarehouse = document.getElementById('warehouseSelect').value;
        if (!selectedWarehouse) {
            document.getElementById('activeWh').textContent = 'No warehouse selected';
            document.getElementById('productGrid').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-warehouse"></i>
                    <h3>Select a Warehouse</h3>
                    <p>Choose a warehouse above to see products</p>
                </div>
            `;
            return;
        }
        const wh = branchMap[selectedWarehouse];
        document.getElementById('activeWh').textContent = `📦 ${wh.display}`;
        loadInventory(selectedWarehouse);
    };

    // --- LOAD INVENTORY ---
    function loadInventory(whId) {
        if (unsubscribeInv) unsubscribeInv();
        
        const q = query(collection(db, 'inventory'), where('branchId', '==', whId));
        unsubscribeInv = onSnapshot(q, (snap) => {
            inventory = snap.docs.map(d => ({
                id: d.id,
                ...d.data(),
                stock: Number(d.data().stock) || 0,
                price: Number(d.data().price) || 0,
                status: d.data().status || 'active'
            }));
            inventory.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            renderProducts();
            updateStats();
        }, (error) => {
            showToast('Error loading: ' + error.message, 'error');
        });
    }

    // --- RENDER PRODUCTS ---
    window.renderProducts = function() {
        const grid = document.getElementById('productGrid');
        const search = document.getElementById('searchInput').value.toLowerCase();
        
        let filtered = inventory.filter(i => {
            const matchSearch = i.name?.toLowerCase().includes(search) || 
                               i.code?.toLowerCase().includes(search) ||
                               (i.category || '').toLowerCase().includes(search);
            return matchSearch;
        });
        
        if (!filtered.length) {
            grid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <h3>No products found</h3>
                    <p>${search ? 'Try a different search' : 'No products in this warehouse'}</p>
                </div>
            `;
            return;
        }
        
        grid.innerHTML = '';
        filtered.forEach(item => {
            const isActive = item.status !== 'inactive';
            const isSoldOut = item.stock <= 0;
            const stockClass = item.stock === 0 ? 'low' : item.stock < 5 ? 'medium' : 'high';
            
            const card = document.createElement('div');
            card.className = 'product-card';
            if (!isActive || isSoldOut) card.style.opacity = '0.6';
            
            let badge = '';
            if (!isActive) badge = '<span class="inactive-badge">Inactive</span>';
            else if (isSoldOut) badge = '<span class="sold-out">Sold Out</span>';
            
            card.innerHTML = `
                ${badge}
                <span class="code">${escapeHtml(item.code)}</span>
                <div class="name">${escapeHtml(item.name)}</div>
                <span class="category">${escapeHtml(item.category || 'General')}</span>
                <div class="price">K${item.price.toFixed(2)}</div>
                <div class="stock">Stock: <span class="num ${stockClass}">${item.stock}</span></div>
                <button class="sell-btn" ${(!isActive || isSoldOut) ? 'disabled' : ''} 
                        onclick="openSellModal('${item.id}')">
                    <i class="fas fa-cart-plus"></i> Sell
                </button>
            `;
            grid.appendChild(card);
        });
    };

    // --- SELL MODAL ---
    window.openSellModal = function(itemId) {
        const item = inventory.find(i => i.id === itemId);
        if (!item) { showToast('Product not found', 'error'); return; }
        if (item.stock <= 0) { showToast('Out of stock!', 'error'); return; }
        if (item.status === 'inactive') { showToast('Product is inactive', 'error'); return; }
        
        selectedProduct = item;
        document.getElementById('modalProductName').textContent = item.name;
        document.getElementById('modalProductCode').textContent = item.code;
        document.getElementById('modalProductPrice').textContent = `K${item.price.toFixed(2)}`;
        document.getElementById('modalProductStock').textContent = item.stock;
        document.getElementById('sellQty').value = 1;
        document.getElementById('sellQty').max = item.stock;
        document.getElementById('sellCustomer').value = '';
        document.getElementById('sellNotes').value = '';
        document.getElementById('sellModal').classList.add('open');
        document.getElementById('sellQty').focus();
    };

    window.closeSellModal = function() {
        document.getElementById('sellModal').classList.remove('open');
        selectedProduct = null;
    };

    window.adjustQty = function(amount) {
        const input = document.getElementById('sellQty');
        let val = parseInt(input.value) || 1;
        val = Math.max(1, val + amount);
        if (selectedProduct) val = Math.min(val, selectedProduct.stock);
        input.value = val;
    };

    // --- SELL FORM ---
    document.getElementById('sellForm').onsubmit = async (e) => {
        e.preventDefault();
        if (!selectedProduct) { showToast('No product selected', 'error'); return; }
        
        const qty = parseInt(document.getElementById('sellQty').value);
        const customer = document.getElementById('sellCustomer').value.trim();
        const notes = document.getElementById('sellNotes').value.trim();
        
        if (isNaN(qty) || qty < 1) { showToast('Enter valid quantity', 'error'); return; }
        if (qty > selectedProduct.stock) { showToast(`Only ${selectedProduct.stock} available`, 'error'); return; }
        
        const btn = document.querySelector('#sellForm button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        
        try {
            const whName = branchMap[selectedWarehouse]?.name || selectedWarehouse;
            
            await runTransaction(db, async (tx) => {
                const invRef = doc(db, 'inventory', selectedProduct.id);
                const invSnap = await tx.get(invRef);
                if (!invSnap.exists()) throw new Error('Product not found');
                const currentStock = invSnap.data().stock || 0;
                if (currentStock < qty) throw new Error(`Only ${currentStock} available`);
                tx.update(invRef, { stock: increment(-qty) });
                
                tx.set(doc(collection(db, 'marketing_sales')), {
                    date: new Date().toISOString().split('T')[0],
                    code: selectedProduct.code,
                    name: selectedProduct.name,
                    category: selectedProduct.category || 'General',
                    price: selectedProduct.price,
                    quantity: qty,
                    subtotal: selectedProduct.price * qty,
                    total: selectedProduct.price * qty,
                    sourceWarehouse: selectedWarehouse,
                    sourceWarehouseName: whName,
                    department: 'marketing',
                    customer: customer || null,
                    notes: notes || null,
                    soldBy: 'Chris (Marketing)',
                    timestamp: serverTimestamp()
                });
            });
            
            showToast(`✅ Sold ${qty} × ${selectedProduct.code} from ${whName}`, 'success');
            closeSellModal();
            updateStats();
            
        } catch (err) {
            showToast('Sale failed: ' + err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Confirm Sale';
        }
    };

    // --- STATS ---
    async function updateStats() {
        try {
            const today = new Date().toISOString().split('T')[0];
            const month = today.slice(0, 7);
            
            const q = query(collection(db, 'marketing_sales'), where('department', '==', 'marketing'));
            const snap = await getDocs(q);
            
            let todayTotal = 0, monthTotal = 0;
            snap.forEach(doc => {
                const d = doc.data();
                const amt = d.total || (d.price * d.quantity);
                if (d.date === today) todayTotal += amt;
                if (d.date && d.date.startsWith(month)) monthTotal += amt;
            });
            
            document.getElementById('todayTotal').textContent = `K${todayTotal.toFixed(2)}`;
            document.getElementById('monthTotal').textContent = `K${monthTotal.toFixed(2)}`;
        } catch (err) {
            console.error('Stats error:', err);
        }
    }

    // --- REFRESH ---
    window.refreshInventory = function() {
        if (selectedWarehouse) {
            loadInventory(selectedWarehouse);
            showToast('🔄 Refreshed', 'success');
        } else {
            showToast('Select a warehouse first', 'warning');
        }
    };

    // --- HELPERS ---
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
    }

    // --- CLOSE MODAL ON CLICK OUTSIDE ---
    document.getElementById('sellModal').addEventListener('click', function(e) {
        if (e.target === this) closeSellModal();
    });

    // --- INIT ---
    document.getElementById('warehouseSelect').value = 'kabanana';
    selectedWarehouse = 'kabanana';
    document.getElementById('activeWh').textContent = '📦 🏪 KABANANA';
    loadInventory('kabanana');
</script>
</body>
</html>
